<?xml version="1.0"?>
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="UI_CANCEL">
                <newseq type="standard">KEYCODE_ESC KEYCODE_LSHIFT OR KEYCODE_ESC KEYCODE_RSHIFT</newseq>
            </port>
            <port type="UI_PAUSE">
                <newseq type="standard">KEYCODE_F5 NOT KEYCODE_LSHIFT NOT KEYCODE_RSHIFT OR KEYCODE_ESC NOT KEYCODE_LSHIFT NOT KEYCODE_RSHIFT</newseq>
            </port>
        </input>
    </system>
</mameconfig>
